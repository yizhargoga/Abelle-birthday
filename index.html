<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Abelle Carmelita Goga</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Cormorant+Garamond:wght@400;500;600;700&family=Nunito:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

html{
scroll-behavior:smooth;
}

body{
font-family:'Nunito',sans-serif;
background:#fffafc;
color:#444;
overflow-x:hidden;
}

section{
padding:80px 20px;
}

.container{
max-width:1000px;
margin:auto;
}

h2,h3{
font-family:'Cormorant Garamond',serif;
}

.section-title{
text-align:center;
color:#ff6fa1;
margin-bottom:30px;
font-size:2.5rem;
}

.btn{
display:inline-block;
padding:14px 30px;
border-radius:50px;
text-decoration:none;
background:#ff75aa;
color:white;
font-weight:700;
box-shadow:0 10px 25px rgba(255,117,170,.35);
transition:.3s;
}

.btn:hover{
transform:translateY(-3px);
}

/* OPENING */

.opening{
position:fixed;
top:0;
left:0;
width:100%;
height:100vh;
background:
linear-gradient(
135deg,
#fff7d6,
#ffe7f1
);
z-index:9999;
display:flex;
justify-content:center;
align-items:center;
text-align:center;
padding:20px;
}

.opening h1{
font-family:'Great Vibes',cursive;
font-size:4rem;
color:#ff75aa;
margin-bottom:15px;
}

.opening p{
margin-bottom:25px;
}

/* HERO */

.hero{
height:100vh;
background:
linear-gradient(
rgba(0,0,0,.35),
rgba(0,0,0,.35)
),
url('images/cover.jpg');
background-size:cover;
background-position:center;
display:flex;
justify-content:center;
align-items:center;
text-align:center;
color:white;
}

.hero-name{
font-family:'Great Vibes',cursive;
font-size:6rem;
text-shadow:0 4px 15px rgba(0,0,0,.45);
animation:fadeUp 2s ease;
}

.hero-subtitle{
font-size:1.3rem;
margin-top:10px;
font-weight:600;
}

@keyframes fadeUp{

from{
opacity:0;
transform:translateY(30px);
}

to{
opacity:1;
transform:translateY(0);
}

}

/* CARD */

.card{
background:white;
border-radius:25px;
padding:35px;
box-shadow:0 10px 30px rgba(0,0,0,.08);
line-height:1.8;
}

/* COUNTDOWN */

.countdown{
display:flex;
justify-content:center;
flex-wrap:wrap;
gap:15px;
}

.time-box{
background:#ffd84c;
width:95px;
padding:18px;
border-radius:20px;
text-align:center;
}

.number{
font-size:30px;
font-weight:bold;
}

/* GALLERY */

.gallery{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:15px;
}

.gallery img{
width:100%;
height:270px;
object-fit:cover;
border-radius:20px;
transition:.3s;
}

.gallery img:hover
